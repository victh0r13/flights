# Roda os testes automáticos sempre que o código muda.
# Se algo quebrar, o GitHub mostra um X vermelho no commit.

name: Testes

on:
  push:
    paths-ignore: ["dados/**", "config/**", "**.md"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-web.txt pytest httpx
      - run: python -m pytest -v
