# Robô de verificação de preços.
# O GitHub liga uma máquina Linux temporária, executa os passos abaixo e desliga.
# Seu PC não precisa estar ligado.

name: Verificar preços

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"  # 4x por dia, em UTC = 21h, 3h, 9h e 15h em Brasília
  workflow_dispatch:              # cria o botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["config/rotas.json"]  # roda assim que você envia rotas novas

permissions:
  contents: write  # permite ao robô salvar o histórico de volta no repositório

concurrency:
  group: verificar-precos  # nunca duas rodadas ao mesmo tempo (evita conflito no histórico)

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar o robô
        run: python robo.py
        env:
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}

      - name: Salvar histórico no repositório
        if: always()  # salva o que conseguiu mesmo se alguma parte falhou
        run: |
          git config user.name "robo-rastreador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Histórico de preços $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            git pull --rebase
            git push
          fi
